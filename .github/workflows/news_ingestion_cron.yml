name: TruthLens 24/7 News & FactCheck Ingestion

on:
  schedule:
    # Запускається автоматично кожні 5 хвилин цілодобово (24/7)
    - cron: "*/5 * * * *"
  workflow_dispatch:
    # Дозволяє також запустити збір новин вручну кнопкою "Run workflow" у вкладці Actions на GitHub

concurrency:
  group: truthlens-news-sync
  cancel-in-progress: false

jobs:
  sync-news-and-factchecks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic pydantic-settings email-validator python-dotenv "sqlalchemy[asyncio]" greenlet asyncpg psycopg2-binary aiosqlite feedparser trafilatura lxml_html_clean beautifulsoup4 httpx APScheduler scikit-learn joblib matplotlib numpy pyjwt "passlib[bcrypt]" bcrypt

      - name: Run 24/7 RSS News & FactCheck Sync into Cloud PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Секрет DATABASE_URL не знайдено! Перейдіть у Settings -> Secrets and variables -> Actions -> New repository secret та додайте DATABASE_URL."
            exit 1
          fi
          if [ -d "NewsAggregatorApp/backend" ]; then
            cd NewsAggregatorApp/backend
          elif [ -d "backend" ]; then
            cd backend
          fi
          python scripts/run_scheduled_sync.py
